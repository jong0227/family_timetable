# 정적 분석 규칙. 두 사람(또는 여러 세션)이 각자 짜도 같은 모양이 나오게 하는 1차 방어선.
# `flutter analyze`가 경고 0개인 상태를 유지한다(커밋 전 필수).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # 계층 규칙 위반(화면이 data/를 직접 import 등)은 리뷰에서 잡는다 — docs/ARCHITECTURE.md
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_fields
    - avoid_print
    - unawaited_futures
    - directives_ordering
    - sort_child_properties_last
    - use_build_context_synchronously
    - prefer_interpolation_to_compose_strings
